<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Une info importante pour le skatepark 🛹</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top,#383064,#101020 70%);color:#fff;font:17px system-ui,sans-serif;text-align:center}main{width:min(100%,620px)}h1{font-size:clamp(26px,7vw,44px)}p{line-height:1.6}.video{aspect-ratio:16/9;position:relative;border-radius:16px;overflow:hidden;background:#000}.video iframe{width:100%;height:100%;border:0}.start{position:absolute;inset:0;width:100%;border:0;background:linear-gradient(#0005,#0009),url('https://img.youtube.com/vi/dQw4w9WgXcQ/hqdefault.jpg') center/cover;color:white;font-size:22px;font-weight:800;cursor:pointer}.start span{padding:16px 25px;border-radius:40px;background:#e63565}.message{opacity:1;transform:none;transition:.7s;margin-top:24px;padding:24px;background:#ffffff12;border:1px solid #ffffff30;border-radius:18px}.message.show{opacity:1;transform:none}.message h2,.message strong{color:#ffda76}.sound-prompt{display:none;width:100%;border:0;border-radius:14px;background:#ffda76;color:#151323;padding:17px;font-size:19px;font-weight:800;margin:14px 0;cursor:pointer}.sound-prompt.visible{display:block}</style></head><body><main><div>🛹 UNE INFO IMPORTANTE</div><h1>À propos du skatepark…</h1><div class="video" id="video"><img src="https://media.giphy.com/media/Vuw9m5wXviFIQ/giphy.gif" alt="Rickroll animé" style="width:100%;height:100%;object-fit:cover" onerror="this.style.display='none'"></div><button id="sound-prompt" class="sound-prompt" type="button">🔊 Appuie ici pour lancer la musique !</button><audio id="rick" src="./rickroll.mp3?v=20261114-2" preload="auto" autoplay controls style="width:100%;margin-top:16px"></audio><section class="message" id="message"><h2>😂 VOUS VOUS ÊTES FAIT TROLLER !</h2><p>Mais attention : ce genre de situation peut réellement arriver. Je compterai sur vous à ce moment-là !</p></section></main><script>const audio=document.getElementById('rick');const prompt=document.getElementById('sound-prompt');function startAudio(){audio.muted=false;audio.volume=1;const p=audio.play();if(p&&typeof p.then==='function')p.then(()=>prompt.classList.remove('visible')).catch(()=>prompt.classList.add('visible'));}prompt.addEventListener('click',startAudio);audio.addEventListener('playing',()=>prompt.classList.remove('visible'));document.addEventListener('DOMContentLoaded',startAudio);startAudio();</script></body></html>
